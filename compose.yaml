services:
  app:
    build:
      context: .
    command: tail -f /dev/null
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./src:/app/src
      - ./data:/app/data:ro
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
    depends_on:
      ollama-pull-chat:
        condition: service_completed_successfully
      ollama-pull-embedding:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull-chat:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: pull ${OLLAMA_MODEL:-llama3.2:3b}

  ollama-pull-embedding:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text-v2-moe}

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/company_agent/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./src/company_agent/database/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro

volumes:
  ollama_data:
  postgres_data:
